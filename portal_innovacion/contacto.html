<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Portal de Innovación Digital</title>
</head>
<body>

    <header>
        <h1>Contacto</h1>
        <nav>
            <a href="index.html">Inicio</a> |
            <a href="acerca.html">Acerca del proyecto</a> |
            <a href="tecnologias.html">Tecnologías</a> |
            <a href="proyectos.html">Proyectos</a> |
            <a href="galeria.html">Galería</a> |
            <a href="recursos.html">Recursos</a> |
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <hr>

    <main>
        <section>
            <h2>Formulario de Contacto</h2>
            <form>
                <p>
                    <label for="nombre">Nombre completo:</label><br>
                    <input type="text" id="nombre" name="nombre">
                </p>

                <p>
                    <label for="correo">Correo electrónico:</label><br>
                    <input type="email" id="correo" name="correo">
                </p>

                <p>
                    <label for="interes">Área de interés:</label><br>
                    <select id="interes" name="interes">
                        <option value="ia">Inteligencia Artificial</option>
                        <option value="iot">Internet de las Cosas</option>
                        <option value="ciberseguridad">Ciberseguridad</option>
                        <option value="software">Desarrollo de Software</option>
                        <option value="robotica">Robótica</option>
                    </select>
                </p>

                <p>
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>
                </p>

                <p>
                    <button type="submit">Enviar</button>
                </p>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p><a href="index.html">Volver al Inicio</a></p>
    </footer>

</body>
</html>
